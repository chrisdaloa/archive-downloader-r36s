# Sorgenti archive.org di esempio.
# Per usare le tue: copia questo file in "archive_sources.conf" (stessa cartella) e modificalo.
# Se "archive_sources.conf" esiste viene usato al posto di questo.
#
# Una sezione per sistema (stesso <name> di es_systems.cfg), una riga per sorgente:
#   Nome visibile = URL
# Gli URL possono essere /details/<id>, /download/<id> (elenco file)
# o /download/<id>/<file> (file singolo).

[ports]
R36S & R36H Ports = https://archive.org/download/r36s-port

# [gba]
# Nome sorgente = https://archive.org/details/identificativo-item

# [nes]
# Nome sorgente = https://archive.org/details/identificativo-item
