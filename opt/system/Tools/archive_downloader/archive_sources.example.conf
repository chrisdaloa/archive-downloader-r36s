# Example archive.org sources.
# To use your own: copy this file to "archive_sources.conf" (same folder) and edit it.
# If "archive_sources.conf" exists it is used instead of this file.
#
# One section per system (same <name> as in es_systems.cfg), one line per source:
#   Display name = URL
# URLs can be /details/<id>, /download/<id> (file list)
# or /download/<id>/<file> (single file).

[ports]
R36S & R36H Ports = https://archive.org/download/r36s-port

# [gba]
# Source name = https://archive.org/details/item-identifier

# [nes]
# Source name = https://archive.org/details/item-identifier
