# archive.org login, needed for items restricted to logged-in users (e.g. portmaster_ports_202405).
# Copy this file to "archive_auth.conf" (same folder; it is not versioned) and fill in your keys.
# Get them from https://archive.org/account/s3.php (free account). Keep them private.
# The keys are only sent to archive.org hosts.

[archive.org]
access = YOUR_ACCESS_KEY
secret = YOUR_SECRET_KEY
